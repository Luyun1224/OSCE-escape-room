name: Deploy OSCE Escape to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Record deployment revision
        run: node --input-type=module -e "import {writeFileSync} from 'node:fs'; writeFileSync('dist/deployment.json', JSON.stringify({revision:process.env.GITHUB_SHA}));"
      - run: npx playwright install --with-deps chromium
      - name: Test the production artifact
        run: npm run test:production
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-browser-results
          path: test-results/
          retention-days: 7
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify the live website and its assets
        run: npx playwright test tests/deployment.spec.ts
        env:
          OSCE_E2E_URL: ${{ steps.deployment.outputs.page_url }}
          OSCE_EXPECTED_REVISION: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-browser-results
          path: test-results/
          retention-days: 7
